# Painel 3/4b (07/11/2026): the photo of each turno's queue and its virada.
# In development only with FOTOS_DA_FILA=1 — it writes to the real data
# there; the tests take their photos themselves (TirarFotoDaFila).
<% if ENV["FOTOS_DA_FILA"] == "1" %>
development:
  foto_da_fila:
    class: FotoDaFilaJob
    schedule: every 5 minutes
<% end %>

production:
  foto_da_fila:
    class: FotoDaFilaJob
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
