# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
# Jobs run in a separate Solid Queue process (Etapa 0.3), so broadcasts from
# them must cross processes: the in-process "async" adapter never reached the
# browser. Development and the E2E server use Solid Cable, like production.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

# RSpec uses the test adapter; bin/e2e sets CABLE_ADAPTER=solid_cable.
test:
<% if ENV["CABLE_ADAPTER"] == "solid_cable" %>
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
<% else %>
  adapter: <%= ENV.fetch("CABLE_ADAPTER", "test") %>
<% end %>

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
