# The production stages of each pedido type (Etapa 2.2, decided 07/10/2026).
# A screen to configure them, and what runs in parallel, comes later; until
# then this file is the rule, read by EtapasProducao.
#
#   medida:  what the baixa asks — metragem (m) or quantidade (pieces)
#   unidade: what a quantidade is counted in (default "peças")
#   esperado: where the expected value comes from — papel (the arte's meters
#            per piece on the paper's width), tecido (the DXF's fit on the
#            item's material), filme (the DTF line's meters on the film),
#            pecas (the pieces of the lines; a DTF line's printed units),
#            metros (a tecido item's meters)
#   linhas:  whose lines — impressao (arte × part × size × side), corte
#            (part × DXF size × material), dtf (etiqueta × size) or tecido
#            (arte × fabric: the item)
#   niveis:  where a baixa may be given — linha, referencia (the arte), pedido
#   trava:   stages that must have the line's baixa first (no stamping without
#            paper printed and pieces cut). A part "não corta" skips corte.
#   reposicao: a baixa with fewer pieces than expected makes a reposição
#            sub-pedido of the missing ones (Etapa 2.2, 4/4)
#   quando:  the stage exists only for pedidos with these values (Etapa
#            2.6b2: the DTF's Corte only when delivered cut)
#   material: what its metragem takes from the stock, adjusted by the baixa
#            (Etapa 2.3e) — impressao (the pedido's paper or DTF film) or
#            linha (each line's fabric); none: the stock is not touched
calcado:
  - chave: impressao
    nome: Impressão
    medida: metragem
    esperado: papel
    linhas: impressao
    material: impressao
    niveis: [linha, referencia, pedido]
  - chave: corte
    nome: Corte
    medida: metragem
    esperado: tecido
    linhas: corte
    material: linha
    niveis: [linha, pedido]
  - chave: estamparia
    nome: Estamparia
    medida: quantidade
    esperado: pecas
    linhas: impressao
    niveis: [linha, referencia, pedido]
    trava: [impressao, corte]
  - chave: conferencia
    nome: Conferência
    medida: quantidade
    esperado: pecas
    linhas: impressao
    niveis: [linha, referencia, pedido]
    trava: [estamparia]
    reposicao: true
# Etapa 2.6b2 (decided 15/10/2026): a line per etiqueta × size (D1); the
# film's meters printed (D2); the units cut, after printing, only when the
# pedido is delivered cut (D3). No Conferência or reposição yet.
dtf:
  - chave: impressao
    nome: Impressão
    medida: metragem
    esperado: filme
    linhas: dtf
    material: impressao
    niveis: [linha, referencia, pedido]
  - chave: corte
    nome: Corte
    medida: quantidade
    unidade: unidades
    esperado: pecas
    linhas: dtf
    niveis: [linha, referencia, pedido]
    trava: [impressao]
    quando:
      entrega: cortada
# Etapa 2.7c (decided 19/10/2026): a line per item (arte × fabric); the
# paper printed, then the Calandra transfers it onto the fabric — both in
# meters, the item's meters expected. No Conferência or reposição yet.
tecido:
  - chave: impressao
    nome: Impressão
    medida: metragem
    esperado: metros
    linhas: tecido
    material: impressao
    niveis: [linha, pedido]
  - chave: calandra
    nome: Calandra
    medida: metragem
    esperado: metros
    linhas: tecido
    material: linha
    niveis: [linha, pedido]
    trava: [impressao]
