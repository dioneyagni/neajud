      - "app/services/{materiais_das_linhas,ajuste_da_baixa,entrada_da_falta}.rb"
      - "app/javascript/controllers/dialogo_da_falta.js"
      - "app/views/pedidos/_dialogo_da_falta.html.erb"
      - "app/controllers/concerns/entrada_da_falta_autorizada.rb"
      - "app/helpers/ajuste_do_estoque_helper.rb"
      - "app/views/pedidos/_consumo_do_pedido.html.erb"
      - "app/services/{saida_do_pedido,aguardando_material}.rb"
      - "app/helpers/aguardando_material_helper.rb"
      - "app/views/pedidos/_aguardando_material.html.erb"
      - "app/controllers/materiais_do_pedido_controller.rb"
      - "app/helpers/materiais_do_pedido_helper.rb"
      - "app/views/pedidos/_materiais_do_pedido.html.erb"
      - "app/services/dono_do_tecido.rb"
      - "app/models/concerns/{escolhe_dono_do_tecido,material_de_impressao_do_pedido}.rb"
      - "app/controllers/{materiais,movimentos,parametros_empresa}_controller.rb"
      - "app/controllers/concerns/movimento_creatable.rb"
      - "app/views/{materiais,movimentos,parametros_empresa}/**/*"
      - "app/models/{materia_prima,movimento_estoque,grupo_material,cor_material}.rb"
      - "app/services/saldos_de_estoque.rb"
      - "app/javascript/controllers/movimento_dono_controller.js"
      - "app/controllers/grupo_materiais_controller.rb"
      - "app/views/grupo_materiais/**/*"
      - "app/assets/stylesheets/grupos_material.css"
      - "app/javascript/controllers/{atributos_do_grupo,group_select}_controller.js"
      - "app/controllers/rede_de_dublagens_controller.rb"
      - "app/views/rede_de_dublagens/**/*"
      - "app/services/rede_de_dublagens.rb"
      - "app/assets/stylesheets/rede_de_dublagens.css"
      - "db/seeds/rede_de_dublagens.yml"
      - "app/services/{importar_rede_de_dublagens,leitura_da_rede_inicial}.rb"
