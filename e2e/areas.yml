# Which E2E specs a change needs (bin/e2e --alterados / --area <name>,
# decided 19/10/2026). Local only: CI always runs the whole suite, so a
# missing pattern costs at worst a red CI, never a regression on main.
#
# A changed file is matched, in this order, against:
#   sem_e2e  — no E2E at all (docs, RSpec, tooling);
#   global   — the whole suite;
#   areas    — every area whose patterns match (a file may hit several);
# anything else runs the whole suite too: in doubt, run everything.
# Patterns are File.fnmatch globs (FNM_PATHNAME | FNM_EXTGLOB): "**/" is any
# folder, {a,b} alternatives. A changed e2e/<name>.spec.js runs that spec.

# Creates the user every other spec signs in as.
sempre: [autenticacao]

# The former arquivos.spec.js: later files reuse data the earlier ones
# uploaded, so any of them runs all of them, in E2E_SPECS order.
bloco:
  - arquivos-upload
  - arquivos-previews
  - arquivos-versions
  - arquivos-dxf-organization
  - arquivos-client-field
  - arquivos-size-selection
  - arquivos-molde-unlink
  - arquivos-dialog-modal
  - pages-clients-modelos-pecas
  - pages-moldes-materials
  - arquivos-gallery
  - arquivos-auto-detection
  - arquivos-corte-comparison
  - arquivos-unique-corte
  - arquivos-nome-arte

sem_e2e:
  - "docs/**/*"
  - "**/*.md"
  - "spec/**/*"
  - "test/**/*"
  - ".github/**/*"
  - ".kamal/**/*"
  - "{.gitignore,.gitattributes,.dockerignore,.rubocop.yml,.rspec,Dockerfile}"
  - "config/{deploy.yml,ci.rb,brakeman.yml,brakeman.ignore,bundler-audit.yml}"
  - "bin/{brakeman,bundler-audit,check-residues,ci,kamal,rubocop,rspec,dev-backup,dev-restore,docker-entrypoint,thrust,setup,dev,jobs}"
  - "lib/tasks/{artes,pedidos,producao,cortes}.rake"
  - "**/.keep"
  - "{log,tmp,storage,script}/**/*"

global:
  - "{Gemfile,Gemfile.lock,package.json,package-lock.json,config.ru,Rakefile}"
  - "db/**/*"
  - "config/{routes.rb,application.rb,environment.rb,boot.rb,puma.rb,database.yml,cable.yml,queue.yml,cache.yml,recurring.yml,importmap.rb,image_policy.xml}"
  - "config/{initializers,environments,locales,icc}/**/*"
  - "lib/ban_middleware.rb"
  - "lib/tasks/catalogo.rake"
  - "config/catalogo_oficial.yml"
  - "public/**/*"
  - "vendor/**/*"
  - "app/views/{layouts,shared,pwa}/**/*"
  - "app/assets/stylesheets/{application,pedido}.css"
  - "app/assets/images/**/*"
  - "config/credentials.yml.enc"
  - "e2e/*.{dxf,tif,png}"
  - "app/javascript/application.js"
  - "app/javascript/controllers/{index,application}.js"
  - "app/javascript/controllers/{flash,dialog,combobox,async_form,auto_submit,processamento,edit_toggle,toggle_switch}_controller.js"
  - "app/controllers/application_controller.rb"
  - "app/controllers/concerns/{authentication,controle_de_acesso,controle_de_visibilidade,numero_digitado,confirmacao_do_pedido}.rb"
  - "app/helpers/{application,excluivel,valores}_helper.rb"
  - "app/models/{application_record,current,arquivo,arquivo_version,arte,pedido,item_pedido,empresa,client,file_category,texto_comparavel,sequencia}.rb"
  - "app/models/concerns/{gera_uuid,atribui_por_uuid,referencia_ativa,excluivel,membro_de_arte,tipo_da_arte}.rb"
  - "app/jobs/{application_job,arquivo_processing_job}.rb"
  - "app/channels/**/*"
  - "app/models/{canais_ao_vivo,visibilidade,autorizacao}.rb"
  - "app/helpers/{canais_ao_vivo,visibilidade}_helper.rb"
  - "e2e/support/**/*"
  - "e2e/areas.yml"
  - "bin/{e2e,e2e-logs.sh,e2e-selecao,rails,rake,importmap}"

areas:
  arquivos:
    specs: [bloco]
    arquivos:
      - "app/controllers/{arquivos,agrupamentos_upload,tamanhos,pecas,nomes_arte}_controller.rb"
      - "app/views/{arquivos,pecas}/**/*"
      - "app/helpers/arquivos_helper.rb"
      - "app/javascript/controllers/{upload,conferencia_upload,batch_select,size_cascade,layer_config,tipo_corte,tipo_grade,giro_corte,range_slider,time_mask,color_picker,grade_editor,client_select,group_select}*.js"
      - "app/services/{agrupamento_do_upload,arquivo_upload_service,arquivo_batch_destroy_service,file_validator,mold_match_service,dxf_*,tamanho_*,cut_layer_configuration_service,nome_do_arquivo,upload_time_estimator,cobertura_da_grade,grade_do_corte,encaixe_do_tamanho}.rb"
      - "app/models/{arquivo_*,tamanho,cut_layer,peca,ban}.rb"
      - "app/models/concerns/{nome_de_arte,giro_no_encaixe,lado_na_arte,papel_na_arte}.rb"
      - "app/jobs/{abuse_detection,preparacao_tamanhos,tamanho_auto_assign,metros_por_peca}_job.rb"
      - "bin/{generate-preview.js,generate-dxf-preview.js,detect-tamanhos.js,extract-tamanho-dxf.js,measure-dxf.js,encaixe-dxf.js}"
  cadastros:
    specs: [clients, clients-cortes, moldes, modelos]
    arquivos:
      - "app/controllers/{clients,moldes,modelos,pecas}_controller.rb"
      - "app/views/{clients,moldes,modelos,pecas}/**/*"
      - "app/models/{molde,molde_peca,modelo,produto,referencia}.rb"
      - "app/services/{catalogo_oficial,molde_composicao_service}.rb"
      - "app/javascript/controllers/{grade_molde,componentes}_controller.js"
  estoque:
