      - "app/services/{salvar_ligacao,mudancas_da_ligacao,uso_da_ligacao}.rb"
      - "app/javascript/controllers/ligacao_controller.js"
      - "app/controllers/situacoes_dublagem_controller.rb"
      - "app/services/salvar_situacao.rb"
      - "app/javascript/controllers/situacao_controller.js"
      - "lib/tasks/rede.rake"
      - "app/controllers/construcoes_controller.rb"
      - "app/views/construcoes/**/*"
      - "app/models/{construcao,camada_construcao}.rb"
      - "app/services/{opcoes_da_construcao,regras_da_construcao,preco_sugerido_da_construcao,chave_da_construcao,montagem_da_chave}.rb"
      - "app/helpers/construcoes_helper.rb"
      - "app/javascript/controllers/{construcao,chave}_controller.js"
      - "app/assets/stylesheets/construcoes.css"
      - "app/controllers/ordens_dublagem_controller.rb"
      - "app/views/ordens_dublagem/**/*"
      - "app/helpers/ordens_dublagem_helper.rb"
      - "app/models/ordem_dublagem.rb"
      - "app/services/{componentes_da_dublagem,dublagens_em_aberto}.rb"
      - "app/assets/stylesheets/dublagens.css"
      - "app/assets/images/icons/lixeira/construcao.svg"
  artes:
    specs: [artes-arquivos, upload-agrupamento, tipo-da-arte, aprovacoes, arquivos-tipo-grade, cor-lisa]
    arquivos:
      - "app/controllers/{artes,arte_arquivos,tipos_da_arte,aprovacoes,solicitacoes_aprovacao,cores}_controller.rb"
      - "app/views/{aprovacoes,cores}/**/*"
