      - "app/helpers/{fila_de_producao,linha_do_tempo,programacao}_helper.rb"
      - "app/models/concerns/avisa_a_fila.rb"
      - "app/javascript/controllers/painel_controller.js"
      - "app/assets/stylesheets/painel.css"
      - "app/assets/stylesheets/painel_tempo.css"
  # Painel 2/4a (05/11/2026): the turnos, the calendar and the rhythm.
  calendario:
    specs: [parametros-producao, painel, painel-programacao, painel-virada]
    arquivos:
      - "app/controllers/{turnos,excecoes_calendario,ritmos_producao}_controller.rb"
      - "app/views/{turnos,ritmos_producao}/**/*"
      - "app/models/{turno,excecao_calendario,ritmo_producao}.rb"
      - "app/services/{calendario_de_producao,feriados_nacionais,ritmo_medido,tempo_do_corte,medir_camadas_do_corte}.rb"
      - "app/helpers/{turnos,ritmos_producao}_helper.rb"
      - "app/assets/stylesheets/turnos.css"
