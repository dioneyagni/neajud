      - "app/controllers/concerns/{producao_sem_corte,ajustes_do_pedido_sem_corte}.rb"
  acesso:
    specs: [usuarios, funcoes, cliente-final, visibilidade-cliente, canais-ao-vivo, aprovacao-do-cliente, cliente-envia, cliente-rascunho]
    arquivos:
