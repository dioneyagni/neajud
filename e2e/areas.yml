      - "app/views/{usuarios,funcoes,senhas,sessions,configuracao,visibilidade_padrao}/**/*"
      - "app/helpers/{funcoes,usuarios}_helper.rb"
      - "app/models/{user,session,vinculo,funcao,tipos_para_cliente,evento_pedido}.rb"
      - "app/services/{cadastro_de_usuario_service,gestao_de_usuarios,configuracao_inicial_service,funcoes_grade_service,envio_do_pedido,aprovar_no_sistema_service,pedir_alteracao_service}.rb"
  lixeira:
