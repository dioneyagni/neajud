name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick libimage-exiftool-perl

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare && bin/rspec

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick libimage-exiftool-perl

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium

      - name: Prepare database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run E2E tests
        env:
          RAILS_ENV: test
        run: |
          bin/rails server -p 3000 -b 0.0.0.0 -e test &>/tmp/neajud_server.log &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/up >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node e2e/arquivos.spec.js
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Upload server logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-log
          path: /tmp/neajud_server.log
          if-no-files-found: ignore
