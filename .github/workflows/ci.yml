name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  check_residues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check for debug and test residue
        run: bin/check-residues

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick libimage-exiftool-perl libtiff-tools

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare && bin/rspec

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick libimage-exiftool-perl libtiff-tools

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium

      # bin/e2e prepares the DB, starts the server and runs every spec listed in
      # E2E_SPECS — the same entry point as local runs, so CI can't drift.
      - name: Run E2E tests
        env:
          RAILS_ENV: test
        run: bash bin/e2e

      - name: Upload server logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-log
          # bin/e2e writes log/e2e/<run>/{requests,server}.log; latest is a symlink.
          path: |
            log/e2e/
            !log/e2e/latest
          if-no-files-found: ignore
