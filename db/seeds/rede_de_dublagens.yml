# The initial dublagem network (Dublagem 2/5, decided 27-29/10/2026; plano
# Etapa 2.9, D2/D3/D8; moved here from config/dublagens.yml when the network
# went to the database, rede editável 1/2, 09/11/2026, Q8a). The database is
# the rule now: `bin/rails rede:importar` (ImportarRedeDeDublagens) only adds
# what is missing — a ligação, situação or group already there is never
# changed. A new instance gets it from db/seeds.rb; the dev database got it
# from the migration; bin/e2e imports it into the test database.
# Checked when read: a wrong value raises naming it and what was expected.
#
#   grupos:      the roles of each group the network names, used only when
#                the group is missing and must be created (superfície,
#                base, estampavel: sim | ressalvas | nao); it asks what a
#                group made in Materiais asks (gramatura) — the team
#                changes that in Grupos
#   situacoes:   the names a construção's situação takes (D6)
#   ligacoes:    one per pair of groups (by GrupoMaterial name)
#     par:       two groups, the upper one first (Oxford over Lona); a
#                ligação holds in either order
#     lado:      trama | avesso — the upper layer's side, only when the rule
#                changes with it; absent, any side
#     ligantes:  the usual ones — a group (Filme, Filme PU, Cola…), with
#                micras: [25, 35] (any of these) or { min: 35 }; no micras,
#                any material of the group
#     dubla:     antes | depois da estampa (D8): before, the dublado may go
#                to the stock and gather pedidos; after, it is the pedido's
#     situacoes: the ligantes in a situação, in place of the usual ones (to
#                restrict, list some of them; to change, list others); a
#                situação not listed keeps the usual ones
#     a_confirmar: the fields guessed when the network was written
#                (ligantes, dubla, situacoes, lado), marked on the page
#
# Every dubla (antes/depois) confirmed by the factory on 04/11/2026
# (Dublagem 5a): no longer "a confirmar".
#
# Oxford–Cetim holds for the Cetim on either side (the rule doesn't change
# with it), so it has no lado.
grupos:
  Oxford: { superficie: true, base: true, estampavel: sim }
  Microfibra: { superficie: true, base: true, estampavel: sim }
  Cetim: { superficie: true, base: true, estampavel: sim }
  Lona: { superficie: false, base: true, estampavel: nao }
  EVA: { superficie: false, base: true, estampavel: nao }
  Espuma: { superficie: false, base: true, estampavel: nao }
  Helanca: { superficie: false, base: true, estampavel: nao }
  Filme: { superficie: false, base: false, estampavel: nao }
  Filme PU: { superficie: false, base: false, estampavel: nao }
  Cola: { superficie: false, base: false, estampavel: nao }

situacoes:
  vai_frequencia: Vai frequência
  tecido_molha: Tecido molha

ligacoes:
  - par: [Oxford, Oxford]
    ligantes: [{ grupo: Filme, micras: [25, 35] }]
    dubla: antes
    situacoes:
      vai_frequencia: [{ grupo: Filme, micras: [35] }]
      tecido_molha: [{ grupo: Filme PU }]
    a_confirmar: [situacoes]

  - par: [Oxford, Microfibra]
    ligantes: [{ grupo: Filme, micras: [25, 35] }]
    dubla: antes
    situacoes:
      vai_frequencia: [{ grupo: Filme, micras: [35] }]
      tecido_molha: [{ grupo: Filme PU }]
    a_confirmar: [situacoes]

  - par: [Oxford, Cetim]
    ligantes: [{ grupo: Filme, micras: [25, 35] }]
    dubla: antes
    situacoes:
      vai_frequencia: [{ grupo: Filme, micras: [35] }]
      tecido_molha: [{ grupo: Filme PU }]
    a_confirmar: [situacoes]

  - par: [Oxford, Lona]
    ligantes: [{ grupo: Filme, micras: { min: 35 } }]
    dubla: antes
    situacoes:
      tecido_molha: [{ grupo: Filme PU }]
    a_confirmar: [situacoes]

  - par: [Oxford, EVA]
    ligantes: [{ grupo: Filme, micras: [25] }]
    dubla: antes
    situacoes:
      tecido_molha: [{ grupo: Filme PU }]
    a_confirmar: [situacoes]

  # The espuma goes on cola, with filme exceptions not told yet.
  - par: [Oxford, Espuma]
    ligantes: [{ grupo: Cola }]
    dubla: depois
    a_confirmar: [ligantes]

  - par: [Espuma, Helanca]
    ligantes: [{ grupo: Cola }]
    dubla: depois
    a_confirmar: [ligantes]
